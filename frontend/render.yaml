services:
  - type: static
    name: rag-qa-system
    env: node
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    plan: free
    region: singapore
    envVars:
      - key: VITE_API_URL
        value: https://rag-api-t46i.onrender.com/api